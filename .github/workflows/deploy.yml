name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Federated (OIDC) auth: no long-lived AWS keys stored in GitHub.
      # AWS_DEPLOY_ROLE_ARN's trust policy only allows this exact repo on
      # the main branch to assume it (see cdk/nest_alert/nest_alert_stack.py).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK app dependencies
        working-directory: cdk
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # cdk.json is gitignored (holds real email/project/device IDs locally).
      # In CI, the non-sensitive tunable defaults come from the example
      # file, and the values that identify you/your device are injected via
      # repo secrets below instead of ever being committed.
      - name: Prepare cdk.json
        working-directory: cdk
        run: cp cdk.json.example cdk.json

      - name: cdk deploy
        working-directory: cdk
        run: |
          cdk deploy --require-approval never \
            -c sender_email="${{ secrets.SENDER_EMAIL }}" \
            -c recipient_email="${{ secrets.RECIPIENT_EMAIL }}" \
            -c nest_project_id="${{ secrets.NEST_PROJECT_ID }}" \
            -c nest_device_id="${{ secrets.NEST_DEVICE_ID }}" \
            -c github_repo="${{ github.repository }}"
